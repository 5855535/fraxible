<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teinco</title>
  <!-- === PWA CONFIGURACIÓN === -->
    <link rel="icon" type="image/png" href="img/icon (2).png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="background-color" content="#000000">
 
  <!-- iOS y Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Teinco">
  <link rel="apple-touch-icon" href="img/icon (2).png">
  <link rel="icon" href="img/icon (2).png" type="image/png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
 
  <style>
    :root {
      --x-pink: #a40060;
      --x-black: #000000;
      --x-border: #2f3336;
    }
    *::-webkit-scrollbar { display: none !important; }
    * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
    body {
      background-color: var(--x-black);
      color: #e7e9ea;
      font-family: 'Inter', sans-serif;
    }
    #app-container { opacity: 0; transition: opacity 0.3s ease; }
    #app-container.visible { opacity: 1; }
    .x-input {
      background: var(--x-black) !important;
      border: 1px solid var(--x-border) !important;
      color: white !important;
    }
    .x-input:focus { border-color: var(--x-pink) !important; outline: none; }
    .btn-blue {
      background-color: var(--x-pink);
      color: white;
      font-weight: 700;
      transition: opacity 0.2s;
    }
    .btn-blue:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-blue:hover:not(:disabled) { opacity: 0.9; }
   
    .mention, .hashtag { color: var(--x-pink); cursor: pointer; }
    .mention:hover, .hashtag:hover { text-decoration: underline; }
    .thread-card {
      border-bottom: 1px solid var(--x-border);
      transition: background 0.2s;
      overflow: hidden;
    }
    .thread-card:hover { background-color: rgba(255,255,255,0.02); }
    @keyframes pulse { 50% { opacity: .5; } }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body>
  <!-- Contenedor maestro -->
  <div id="app-container">
   
    <nav class="border-b border-[#2f3336] sticky top-0 bg-black/80 backdrop-blur-md z-50">
      <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2 cursor-pointer" onclick="window.location.reload()">
          <img src="img/icon (2).png" alt="Logo" class="w-8 h-8 object-contain">
          Teinco
        </h1>
        <div id="nav-user"></div>
      </div>
    </nav>
    <div class="max-w-2xl mx-auto min-h-screen border-x border-[#2f3336]">
     
      <!-- Pantalla de Auth -->
      <div id="auth-screen" class="hidden p-10 text-center flex flex-col items-center justify-center min-h-[80vh]">
        <img src="img/icon (2).png" alt="Logo" class="w-24 h-24 mb-8 object-contain">
       
        <div id="login-container" class="space-y-4 w-full max-w-xs">
          <h2 class="text-3xl font-bold mb-10 tracking-tight">Inicia Sesion</h2>
          <input id="email" type="email" placeholder="Correo electrónico" class="w-full p-3 rounded x-input"/>
          <input id="password" type="password" placeholder="Contraseña" class="w-full p-3 rounded x-input"/>
          <button onclick="login()" class="w-full btn-blue py-2.5 rounded-full">Iniciar sesión</button>
          <p id="login-error" class="text-red-500 text-xs mt-2 hidden"></p>
          <p class="text-sm text-zinc-500">¿No tienes cuenta? <button onclick="toggleAuth(true)" class="text-pink-400 font-bold">Regístrate</button></p>
        </div>
        <div id="register-container" class="hidden space-y-4 w-full max-w-xs">
          <h2 class="text-2xl font-bold mb-6">Crear cuenta</h2>
          <input id="reg-username" type="text" placeholder="Nombre de usuario" class="w-full p-3 rounded x-input"/>
          <input id="reg-email" type="email" placeholder="Correo electrónico" class="w-full p-3 rounded x-input"/>
          <input id="reg-password" type="password" placeholder="Contraseña" class="w-full p-3 rounded x-input"/>
          <button onclick="handleRegister()" class="w-full btn-blue py-2.5 rounded-full">Registrarse</button>
          <p id="reg-error" class="text-red-500 text-xs mt-2 hidden"></p>
          <p class="text-sm text-zinc-500">¿Ya tienes cuenta? <button onclick="toggleAuth(false)" class="text-pink-400 font-bold">Inicia sesión</button></p>
        </div>
      </div>
      <!-- App Principal -->
      <div id="main-app" class="hidden">
        <div class="p-4 border-b border-[#2f3336]">
          <div class="flex gap-4">
            <div class="w-12 h-12 rounded-full bg-zinc-900 flex items-center justify-center text-[var(--x-pink)] border border-zinc-800">
              <i class="fas fa-user"></i>
            </div>
            <div class="flex-1">
              <textarea id="thread-content" rows="1" placeholder="¿Qué está pasando?"
                        maxlength="280"
                        class="w-full bg-transparent border-none text-xl focus:outline-none resize-none overflow-hidden"></textarea>
             
              <div class="flex justify-between items-center pt-3 border-t border-[#2f3336] mt-2">
                <div id="char-counter" class="text-[10px] font-bold text-zinc-600">0 / 280</div>
                <button id="btn-post" onclick="createThread()" class="btn-blue px-5 py-1.5 rounded-full text-sm">Postear</button>
              </div>
            </div>
          </div>
        </div>
        <div id="skeletons" class="hidden">
          <div class="p-4 border-b border-[#2f3336] animate-pulse">
              <div class="flex gap-3">
                  <div class="w-10 h-10 bg-zinc-900 rounded-full"></div>
                  <div class="flex-1 space-y-3">
                      <div class="h-3 bg-zinc-900 rounded w-1/4"></div>
                      <div class="h-3 bg-zinc-900 rounded w-full"></div>
                      <div class="h-3 bg-zinc-900 rounded w-1/2"></div>
                  </div>
              </div>
          </div>
        </div>
        <div id="threads-list"></div>
      </div>
    </div>
  </div>

  <!-- Modal de Publicación -->
  <div id="thread-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-50 p-4">
    <div class="w-full max-w-2xl bg-black border border-[#2f3336] rounded-2xl flex flex-col max-h-[90vh]">
      <div class="p-4 border-b border-[#2f3336] flex justify-between items-center">
        <span class="font-bold">Publicación</span>
        <button onclick="closeModal()" class="text-2xl text-zinc-500 hover:text-white">&times;</button>
      </div>
      <div id="modal-body" class="overflow-y-auto p-4 flex-1"></div>
    </div>
  </div>

  <!-- Modal de Confirmación -->
  <div id="confirm-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[200]">
    <div class="bg-[#1a1a1a] border border-[#2f3336] rounded-3xl w-full max-w-xs p-6 text-center">
      <p id="confirm-message" class="text-zinc-300 text-[17px] mb-6"></p>
      <div class="flex gap-3">
        <button onclick="cancelConfirm()" 
                class="flex-1 py-3.5 rounded-2xl border border-[#2f3336] text-white font-medium hover:bg-zinc-900">
          Cancelar
        </button>
        <button onclick="confirmDelete()" 
                class="flex-1 py-3.5 rounded-2xl bg-red-600 hover:bg-red-700 font-bold">
          Sí, eliminar
        </button>
      </div>
    </div>
  </div>

  <!-- Botón Instalar -->
  <button id="install-btn" class="hidden fixed bottom-6 right-6 bg-[#a40060] hover:bg-[#8c0050] text-white px-6 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 z-[100]">
    <i class="fas fa-download"></i>
    <span class="font-semibold">Instalar App</span>
  </button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDkcWQuH3lrVwJ3DrqlAsTv0VdHex7bXek",
      authDomain: "anonx-944b5.firebaseapp.com",
      projectId: "anonx-944b5",
      storageBucket: "anonx-944b5.firebasestorage.app",
      messagingSenderId: "357048503802",
      appId: "1:357048503802:web:ed208576020c6a52942843"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const messaging = firebase.messaging();

    let currentUser = null;
    let userData = null;
    let deferredPrompt = null;
    let deleteCallback = null;

    // PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('✅ Service Worker registrado'))
        .catch(err => console.error(err));
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      deferredPrompt = e;
      document.getElementById('install-btn').classList.remove('hidden');
    });

    document.getElementById('install-btn').addEventListener('click', () => {
      deferredPrompt?.prompt();
    });

    // Notificaciones
    async function requestNotificationPermission() {
      try {
        if (Notification.permission === 'granted') return;
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const token = await messaging.getToken({ vapidKey: "okhphbHSkIE0P-ps0Sm0xArwtxoI2NpnQzKhl7Ruy-M" });
          if (currentUser) await db.collection('users').doc(currentUser.uid).update({ fcmToken: token });
        }
      } catch (err) { console.error(err); }
    }

    messaging.onMessage((payload) => {
      new Notification(payload.notification?.title || "teinco curtido", {
        body: payload.notification?.body || "",
        icon: "img/icon (2).png"
      });
    });

    // ==================== ENVIAR NOTIFICACIÓN POR MENCIÓN ====================
    async function sendMentionNotification(mentionedUsername, content, postId, type = "post") {
      if (!mentionedUsername || mentionedUsername.toLowerCase() === (userData?.username || "")) return;

      try {
        const snapshot = await db.collection('users').where('username', '==', mentionedUsername.toLowerCase()).get();
        if (snapshot.empty) return;

        const token = snapshot.docs[0].data().fcmToken;
        if (!token) return;

        const title = type === "comment" 
          ? `@${userData.username} te mencionó en un comentario` 
          : `@${userData.username} te mencionó`;

        const payload = {
          token: token,
          notification: {
            title: title,
            body: content.length > 90 ? content.substring(0, 87) + "..." : content,
            icon: "img/icon (2).png"
          }
        };

        // Enviar notificación
        await fetch('https://fcm.googleapis.com/fcm/send', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'BGkn004H5QNJgbkW9WSxy0BQtSoeOem6nzZGygTg1-XjwtOCrjzEMjGbapCtZS9jGY3ZjSsjuCfOS2zBlSu4jx4'   // ← Reemplaza con tu Server Key de Firebase
          },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("Error enviando notificación:", e);
      }
    }

    // ==================== FUNCIONES ====================
    function formatText(text) {
      if(!text) return "";
      return text.replace(/@(\w+)/g, '<span class="mention">@$1</span>')
                 .replace(/#(\w+)/g, '<span class="hashtag">#$1</span>');
    }

    const threadInput = document.getElementById('thread-content');
    const counter = document.getElementById('char-counter');

    threadInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
      const length = this.value.length;
      counter.innerText = `${length} / 280`;
      counter.style.color = length >= 250 ? '#f91880' : length >= 200 ? '#ffd700' : '#536471';
    });

    function toggleAuth(showRegister) {
      document.getElementById('login-container').classList.toggle('hidden', showRegister);
      document.getElementById('register-container').classList.toggle('hidden', !showRegister);
    }

    function showError(elementId, message) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.classList.remove('hidden');
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch(e) {
        showError('login-error', "Credenciales incorrectas");
      }
    }

    async function handleRegister() {
      const username = document.getElementById('reg-username').value.trim().toLowerCase();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const errorEl = document.getElementById('reg-error');
      errorEl.classList.add('hidden');

      if (!username || !email || !password) return showError('reg-error', "Todos los campos son obligatorios");
      if (password.length < 6) return showError('reg-error', "La contraseña debe tener al menos 6 caracteres");

      try {
        console.log("🔄 Creando cuenta...");
        const userCred = await auth.createUserWithEmailAndPassword(email, password);
        console.log("✅ Usuario Auth creado:", userCred.user.uid);

        await db.collection('users').doc(userCred.user.uid).set({
          username: username,
          isVerified: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        console.log("✅ Registro completado");
        showError('reg-error', "¡Cuenta creada! Iniciando sesión...");
        errorEl.style.color = "#22c55e";
      } catch (error) {
        console.error("❌ Error:", error.code, error.message);
        let msg = "Error al registrar";
        if (error.code === 'auth/email-already-in-use') msg = "Este correo ya está registrado";
        else if (error.code === 'auth/invalid-email') msg = "El correo no es válido";
        else if (error.code === 'auth/weak-password') msg = "Contraseña demasiado débil";
        showError('reg-error', msg);
      }
    }

    function logout() { auth.signOut(); window.location.reload(); }

    async function createThread() {
      const content = threadInput.value.trim();
      if (!content || !userData) return;

      const newThreadRef = await db.collection('threads').add({
        content,
        author: userData.username,
        authorId: currentUser.uid,
        isVerified: userData.isVerified || false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      threadInput.value = '';
      threadInput.style.height = 'auto';
      counter.innerText = `0 / 280`;

      // Detectar y enviar notificaciones por menciones
      const mentions = content.match(/@(\w+)/g) || [];
      mentions.forEach(m => {
        sendMentionNotification(m.substring(1), content, newThreadRef.id, "post");
      });
    }

    // Función de eliminar actualizada
    async function deleteItem(path, id) {
      showConfirm("¿Eliminar permanentemente? Esta acción no se puede deshacer.", async () => {
        try {
          await db.doc(`${path}/${id}`).delete();
        } catch (e) {
          console.error("Error al eliminar:", e);
        }
      });
    }

    async function quickComment(threadId) {
      const input = document.getElementById(`comment-to-${threadId}`);
      const text = input.value.trim();
      if (!text || !userData) return;

      await db.collection(`threads/${threadId}/comments`).add({
        text,
        author: userData.username,
        authorId: currentUser.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      input.value = '';

      // Detectar menciones en comentarios
      const mentions = text.match(/@(\w+)/g) || [];
      mentions.forEach(m => {
        sendMentionNotification(m.substring(1), text, threadId, "comment");
      });
    }

    function showConfirm(message, callback) {
      deleteCallback = callback;
      document.getElementById('confirm-message').textContent = message;
      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function confirmDelete() {
      if (deleteCallback) deleteCallback();
      document.getElementById('confirm-modal').classList.add('hidden');
    }

    function cancelConfirm() {
      document.getElementById('confirm-modal').classList.add('hidden');
    }

    // Resto de funciones sin cambios
    function listenThreads() {
      document.getElementById('skeletons').classList.remove('hidden');
      db.collection('threads').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
        document.getElementById('skeletons').classList.add('hidden');
        const container = document.getElementById('threads-list');
        container.innerHTML = '';
        snapshot.forEach(doc => {
          const t = doc.data();
          const isOwner = t.authorId === (currentUser ? currentUser.uid : '');
          const badge = t.isVerified ? '<i class="fas fa-check-circle text-[var(--x-pink)] ml-1"></i>' : '';
          container.innerHTML += `
            <div class="thread-card p-4">
              <div class="flex gap-3">
                <div class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-xs font-bold uppercase text-pink-400">
                  ${t.author ? t.author[0] : '?'}
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex justify-between items-center">
                    <span class="font-bold text-sm flex items-center">@${t.author}${badge}</span>
                    ${isOwner ? `<button onclick="deleteItem('threads', '${doc.id}')" class="text-zinc-600 hover:text-red-500 transition"><i class="fas fa-trash-alt text-xs"></i></button>` : ''}
                  </div>
                  <p class="text-sm mt-1 whitespace-pre-wrap break-words">${formatText(t.content)}</p>
                  <div class="flex gap-8 mt-3 text-zinc-500 text-sm">
                    <span class="flex items-center gap-2 cursor-pointer hover:text-pink-400" onclick="openModal('${doc.id}')"><i class="far fa-comment"></i> Responder</span>
                  </div>
                  <div class="mt-4 flex gap-2">
                    <input id="comment-to-${doc.id}" placeholder="Tu respuesta" class="flex-1 bg-transparent border-b border-[#2f3336] text-xs py-1 focus:outline-none focus:border-blue-500"/>
                    <button onclick="quickComment('${doc.id}')" class="text-pink-400 text-xs font-bold hover:text-white">Post</button>
                  </div>
                  <div id="comments-box-${doc.id}" class="mt-4 space-y-2"></div>
                </div>
              </div>
            </div>`;
          listenComments(doc.id);
        });
      });
    }

    function listenComments(threadId) {
      db.collection(`threads/${threadId}/comments`).orderBy('createdAt', 'asc').onSnapshot(snapshot => {
        const box = document.getElementById(`comments-box-${threadId}`);
        if (!box) return;
        box.innerHTML = '';
        const allComments = [];
        snapshot.forEach(doc => allComments.push({id: doc.id, ...doc.data()}));
        allComments.slice(0, 3).forEach(c => {
          const isOwner = c.authorId === (currentUser ? currentUser.uid : '');
          box.innerHTML += `
            <div class="text-xs bg-zinc-900/40 p-2 rounded flex justify-between group overflow-hidden">
              <span class="break-words flex-1"><b class="text-pink-400">@${c.author}:</b> ${formatText(c.text)}</span>
              ${isOwner ? `<button onclick="deleteItem('threads/${threadId}/comments', '${c.id}')" class="opacity-0 group-hover:opacity-100 text-zinc-600 hover:text-red-500 ml-2"><i class="fas fa-times"></i></button>` : ''}
            </div>`;
        });
        if (allComments.length > 3) {
          box.innerHTML += `<button onclick="openModal('${threadId}')" class="text-pink-400 text-[10px] font-bold mt-1 hover:underline">Ver los ${allComments.length} comentarios</button>`;
        }
      });
    }

    async function openModal(threadId) {
      const doc = await db.collection('threads').doc(threadId).get();
      const t = doc.data();
      const modalBody = document.getElementById('modal-body');
      const badge = t.isVerified ? '<i class="fas fa-check-circle text-[var(--x-pink)] ml-1"></i>' : '';
      modalBody.innerHTML = `
        <div class="mb-6">
          <span class="font-bold flex items-center">@${t.author}${badge}</span>
          <p class="text-lg mt-2 break-words">${formatText(t.content)}</p>
        </div>
        <div id="modal-comments-list" class="space-y-4 border-t border-[#2f3336] pt-4"></div>`;
      document.getElementById('thread-modal').classList.remove('hidden');
      db.collection(`threads/${threadId}/comments`).orderBy('createdAt', 'asc').onSnapshot(snapshot => {
        const list = document.getElementById('modal-comments-list');
        if (!list) return;
        list.innerHTML = '';
        snapshot.forEach(cDoc => {
          const c = cDoc.data();
          const isOwner = c.authorId === (currentUser ? currentUser.uid : '');
          list.innerHTML += `
            <div class="flex justify-between items-start bg-zinc-900/20 p-3 rounded">
              <div class="min-w-0 flex-1">
                <span class="font-bold text-pink-400 text-xs">@${c.author}</span>
                <p class="text-sm mt-1 break-words">${formatText(c.text)}</p>
              </div>
              ${isOwner ? `<button onclick="deleteItem('threads/${threadId}/comments', '${cDoc.id}')" class="text-zinc-600 hover:text-red-500 ml-2"><i class="fas fa-trash text-[10px]"></i></button>` : ''}
            </div>`;
        });
      });
    }

    function closeModal() { document.getElementById('thread-modal').classList.add('hidden'); }

    // Auth State
    auth.onAuthStateChanged(async (user) => {
      currentUser = user;
      const nav = document.getElementById('nav-user');
      const authScreen = document.getElementById('auth-screen');
      const mainApp = document.getElementById('main-app');
      const appContainer = document.getElementById('app-container');

      if (user) {
        const doc = await db.collection('users').doc(user.uid).get();
        userData = doc.data();
        
        authScreen.classList.add('hidden');
        mainApp.classList.remove('hidden');
        nav.innerHTML = `<button onclick="logout()" class="text-xs font-bold text-zinc-500 hover:text-white border border-zinc-800 px-3 py-1 rounded-full">Salir</button>`;
        
        listenThreads();
        requestNotificationPermission();
      } else {
        mainApp.classList.add('hidden');
        authScreen.classList.remove('hidden');
        authScreen.classList.add('flex');
        nav.innerHTML = '';
      }
      appContainer.classList.add('visible');
    });
  </script>
</body>
</html>
